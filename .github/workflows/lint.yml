name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  SHELLCHECK_VERSION: v0.11.0
  SHFMT_VERSION: v3.14.1

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      # shellcheck has no zsh support, so this covers the executable sh/bash scripts only.
      # install is left out of shfmt below: it column-aligns its manifest and case arms
      - run: git ls-files -z '*.sh' install | xargs -0 shellcheck

  zsh-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n
        run: |
          status=0
          for f in $(git ls-files '*.zsh') zshrc zprofile; do
            zsh -n "$f" || status=1
          done
          exit $status

  shfmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shfmt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$RUNNER_TEMP/shfmt"
      # settings come from .editorconfig
      - run: git ls-files -z '*.sh' '*.zsh' zshrc zprofile | xargs -0 "$RUNNER_TEMP/shfmt" -d
